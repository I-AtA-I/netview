name: Verify and package NetView

on:
  push:
    branches:
      - feature/analytics-and-testing-tools
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    name: Verify (Python ${{ matrix.python-version }})
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Smoke-test the desktop UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from netview.gui.analysis_dialog import AnalysisDialog
          from netview.gui.main_window import MainWindow

          app = QApplication([])
          window = MainWindow()
          dialog = AnalysisDialog([])
          assert window.windowTitle().startswith("NetView")
          assert dialog.windowTitle().endswith("Analysis center")
          dialog._worker.wait()
          app.processEvents()
          assert dialog.analysis is not None
          dialog.close()
          window.close()
          PY

      - name: Build wheel and source distribution
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Create full source archive
        if: matrix.python-version == '3.12'
        run: |
          git archive --format=zip --prefix=NetView/ "$GITHUB_SHA" -o dist/NetView-full.zip

      - name: Upload build artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: NetView-build
          path: dist/*
          if-no-files-found: error
          retention-days: 14
