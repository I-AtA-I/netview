[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netview"
version = "1.0.0"
description = "A desktop network protocol analyzer"

[project.scripts]
netview = "netview.app:main"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.12",
    "scapy>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
